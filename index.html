<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우리달력">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>우리 달력</title>
<style>
:root{
  --a:#4F8EF7; --b:#F2709C; --both:#8E6CF0;
  --bg:#fff; --text:#1d1d1f; --sub:#8a8f98; --line:#eceef1; --soft:#f5f6f8;
  --red:#e5484d; --blue:#3b7ddd; --green:#30c26b;
  --tab-h:58px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit;font-size:16px;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg)}
.view{display:none;flex:1;min-height:0;flex-direction:column;padding-top:var(--safe-t);position:relative}
.view.active{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding:0 16px 32px}

/* 탭 */
.tabbar{display:flex;border-top:1px solid var(--line);padding-bottom:var(--safe-b);background:#fff;flex:none}
.tabbar button{flex:1;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:#b0b4bb}
.tabbar button.on{color:var(--text)}
.tabbar svg{width:24px;height:24px}

/* 캘린더 머리 */
.cal-head{display:flex;align-items:center;gap:2px;padding:8px 10px 2px 14px;flex:none}
.cal-head h1{font-size:21px;font-weight:800;margin:0 4px;letter-spacing:-.3px;white-space:nowrap}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#5b6068;flex:none}
.icon-btn:active{background:var(--soft)}
.icon-btn svg{width:20px;height:20px}
.spacer{flex:1}
.today-btn{font-size:13px;font-weight:700;padding:6px 12px;border:1px solid var(--line);border-radius:999px}
.state-pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--soft);color:#6b7079;margin-right:6px;white-space:nowrap}
.state-pill.err{background:#fdecec;color:var(--red)}
.live-dot{display:block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:10px}
.filters{display:flex;gap:6px;padding:6px 14px 8px;overflow-x:auto;flex:none;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;background:var(--soft);white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.off{color:#b0b4bb}
.chip.off i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;font-weight:600;color:var(--sub);text-align:center;padding:2px 0 5px;border-bottom:1px solid var(--line);flex:none}
.weekdays .sun{color:var(--red)} .weekdays .sat{color:var(--blue)}

/* 달력 칸 */
.month{flex:1;min-height:0;display:flex;flex-direction:column;touch-action:pan-y}
.week{flex:1 1 0;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);overflow:hidden}
.cell{grid-row:1/-1;position:relative;text-align:left;padding-top:3px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;min-width:0}
.cell .dn{display:inline-grid;place-items:center;min-width:21px;height:21px;margin-left:3px;padding:0 3px;border-radius:11px;font-size:12px;font-weight:600}
.cell.other{opacity:.35}
.cell.sun .dn,.cell.hol .dn{color:var(--red)}
.cell.sat .dn{color:var(--blue)}
.cell.today .dn{background:var(--text);color:#fff}
.cell.sel{background:#f2f3f6}
.cell .mk{position:absolute;top:10px;right:5px;color:#ff5c8a}
.cell .mk svg{width:8px;height:8px}
.cell .more{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:10px;color:var(--sub);font-weight:700}
.bar{position:relative;z-index:1;pointer-events:none;margin:0 1px 1px;padding:0 3px;height:16px;line-height:16px;font-size:10.5px;font-weight:600;color:#fff;border-radius:3px;white-space:nowrap;overflow:hidden;min-width:0}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.bar.timed{color:var(--c);background:var(--t)!important}
.fab{position:absolute;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;background:var(--text);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:5}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.95)}

/* 아래에서 올라오는 창 */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88vh;max-height:88dvh;background:#fff;border-radius:18px 18px 0 0;z-index:21;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:var(--safe-b);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.grab{width:38px;height:5px;border-radius:3px;background:#dcdfe3;margin:8px auto 2px;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px 10px 16px;flex:none;min-height:48px}
.sheet-head h2{font-size:17px;margin:0;font-weight:800}
.sheet-head h2 small{font-size:13px;color:var(--sub);font-weight:600;margin-left:4px}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 20px}
.txt-btn{font-size:15px;font-weight:600;color:var(--sub);padding:6px 4px;min-width:40px;text-align:left}
.txt-btn.primary{color:var(--text);font-weight:800;text-align:right}

/* 첫 화면 */
.welcome{text-align:center;padding:14px 22px 22px}
.welcome h2{font-size:23px;margin:10px 0 6px;font-weight:800}
.welcome>p{color:var(--sub);font-size:14.5px;margin:0 0 18px;line-height:1.55}
.w-logo svg{width:76px;height:76px;margin:4px auto 0}
.hint{background:#f4f6fb;border-radius:12px;padding:12px 14px;font-size:13px;color:#4a5070;line-height:1.6;text-align:left;margin-bottom:16px}
.steps{text-align:left;font-size:14px;line-height:1.75;margin:0 0 16px;padding-left:20px;color:#333}
.note{font-size:14px;color:#555;line-height:1.55;margin:0 0 14px}
.paste-row{display:flex;gap:8px;align-items:center}
.paste-row .full-inp{flex:1;min-width:0}

/* 날짜 창 */
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--soft);color:#555}
.tag.hol{background:#fdecec;color:var(--red)}
.tag.anniv,.tag.dday{background:#ffeef4;color:#e04a7b}
.ev-item{display:flex;align-items:stretch;gap:12px;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line)}
.ev-item:active{background:var(--soft)}
.ev-item .stripe{width:4px;border-radius:2px;background:var(--c);flex:none}
.ev-title{font-size:15px;font-weight:700;word-break:break-all}
.ev-sub{font-size:12.5px;color:var(--sub);margin-top:3px}
.ev-memo{font-size:12.5px;color:#666;margin-top:4px;white-space:pre-wrap;word-break:break-all}
.empty{color:var(--sub);text-align:center;font-size:14px;padding:22px 0}
.add-line{width:100%;margin-top:12px;padding:13px;border-radius:12px;background:var(--soft);font-weight:700;font-size:14px}

/* 입력 */
.title-input{width:100%;border:0;outline:0;font-size:22px;font-weight:800;padding:6px 0 12px;border-bottom:1px solid var(--line);background:transparent}
.field-label{font-size:12px;font-weight:700;color:var(--sub);margin:16px 0 8px}
.seg{display:flex;gap:8px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 6px;border-radius:12px;background:var(--soft);font-size:14px;font-weight:700;color:#777;min-width:0}
.seg button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.seg button.on{background:var(--c,var(--text));color:#fff}
.seg button.on i{background:#fff}
.seg.plain button.on{background:var(--text)}
.form-card{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;min-height:50px;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.row>span:first-child{font-weight:600;flex:none}
.dt{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.dt input,.inp{border:0;background:var(--soft);border-radius:8px;padding:7px 9px;outline:0;min-height:36px}
.event-period{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:10px;padding:9px 14px}.event-period label{display:grid;gap:4px;font-size:13px;font-weight:600}.event-period input{box-sizing:border-box;min-width:0;width:100%;font:inherit;color:inherit}.allday .event-period{grid-template-columns:1fr}.allday .t-only{display:none}
textarea{width:100%;margin-top:16px;min-height:84px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:0;resize:vertical}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0}
.switch b{position:absolute;inset:0;border-radius:999px;background:#d9dce1;transition:.2s;pointer-events:none}
.switch b::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.switch input:checked+b{background:var(--text)}
.switch input:checked+b::after{transform:translateX(20px)}
.danger-btn{width:100%;margin-top:18px;padding:13px;border-radius:12px;color:var(--red);font-weight:700;background:#fdf0f0}
.primary-btn{width:100%;margin-top:14px;padding:14px;border-radius:12px;color:#fff;font-weight:800;background:var(--text);font-size:15px}
.secondary-btn{width:100%;margin-top:10px;padding:14px;border-radius:12px;font-weight:800;background:var(--soft);font-size:15px}
.ghost-btn{padding:9px 14px;border-radius:10px;background:var(--soft);font-weight:700;font-size:14px;white-space:nowrap;flex:none}
.link-btn{display:block;margin:14px auto 0;font-size:14px;color:var(--sub);font-weight:600;padding:6px 10px}
.link-btn.danger{color:var(--red)}
.full-inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;outline:0;font-size:16px}

/* 페이지 머리 */
.page-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px 16px;flex:none}
.page-head h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.3px}
.page-head .icon-btn{width:38px;height:38px;background:var(--soft);color:var(--text)}

/* 디데이 */
.hero{border-radius:20px;padding:22px 20px;color:#fff;background:linear-gradient(135deg,var(--a),var(--both) 55%,var(--b));margin-top:4px}
.hero .names{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;opacity:.95}
.hero .names svg{width:16px;height:16px}
.hero .big{font-size:15px;font-weight:600;margin-top:14px;opacity:.95}
.hero .big b{font-size:40px;font-weight:800;letter-spacing:-1px;margin:0 2px}
.hero .since{font-size:12.5px;opacity:.85;margin-top:4px}
.hero-empty{border:1.5px dashed #d6d9de;border-radius:20px;padding:22px;text-align:center;color:var(--sub);font-size:14px;margin-top:4px;line-height:1.55}
.hero-empty .ghost-btn{margin-top:12px}
.sec-title{margin:26px 2px 10px;font-size:15px;font-weight:800}
.mile{display:flex;gap:8px}
.mile div{flex:1;min-width:0;padding:12px;border-radius:14px;background:var(--soft)}
.mile b{display:block;font-size:15px}
.mile span{display:block;font-size:12px;color:var(--sub);margin-top:3px}
.mile em{display:block;font-style:normal;font-size:13px;font-weight:800;color:#e04a7b;margin-top:6px}
.dd-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:16px;background:var(--soft);margin-bottom:8px}
.dd-card:active{filter:brightness(.97)}
.dd-card .t{flex:1;min-width:0}
.dd-card .t b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-card .t span{display:block;font-size:12px;color:var(--sub);margin-top:3px}
.dd-badge{font-size:18px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.dd-badge.soon{color:#e04a7b}
.dd-badge.past{color:#b0b4bb}

/* 설정 */
.card{border:1px solid var(--line);border-radius:16px;margin-top:14px;overflow:hidden}
.card h3{font-size:13px;color:var(--sub);margin:0;padding:14px 14px 4px;font-weight:700}
.card .row input.inp{text-align:right;max-width:58%}
.card p{font-size:13px;color:#666;line-height:1.55;margin:2px 14px 10px}
.card .pad{padding:2px 14px 14px}
.share-state{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;padding:6px 14px 8px}
.share-state .dot{width:9px;height:9px;border-radius:50%;background:#c4c8ce;flex:none}
.share-state .dot.on{background:var(--green)}
.share-state .dot.err{background:var(--red)}
.share-state .dot.wait{background:#f5a623}
.color-line{display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px 14px;border-bottom:1px solid var(--line);font-size:15px;font-weight:600;text-align:left}
.color-line:last-child{border-bottom:0}
.color-line i{width:26px;height:26px;border-radius:50%;background:var(--c);flex:none}
.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:6px 10px 8px;justify-items:center}
.sw{width:46px;height:46px;border-radius:50%;background:var(--c)}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.foot{font-size:12.5px;color:#a3a8b0;text-align:center;margin:20px 0 0}
.foot button{color:#6b7079;font-weight:700;text-decoration:underline;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 84px);transform:translate(-50%,10px);background:rgba(29,29,31,.92);color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:40;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <!-- 캘린더 -->
  <section id="view-cal" class="view active">
    <header class="cal-head">
      <button class="icon-btn" id="prevM" aria-label="이전 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 id="monthTitle"></h1>
      <button class="icon-btn" id="nextM" aria-label="다음 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      <div class="spacer"></div>
      <div id="shareState"></div>
      <button class="today-btn" id="todayBtn">오늘</button>
    </header>
    <div class="filters" id="filters"></div>
    <div class="weekdays"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span></div>
    <div class="month" id="month"></div>
    <button class="fab" id="fab" aria-label="일정 추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  </section>

  <!-- 디데이 -->
  <section id="view-dday" class="view">
    <header class="page-head"><h1>디데이</h1><button class="icon-btn" id="ddayAdd" aria-label="디데이 추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></header>
    <div class="scroll" id="ddayBody"></div>
  </section>

  <!-- 설정 -->
  <section id="view-set" class="view">
    <header class="page-head"><h1>설정</h1></header>
    <div class="scroll" id="setBody"></div>
  </section>

  <nav class="tabbar" id="tabbar">
    <button data-tab="cal" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>캘린더</button>
    <button data-tab="dday"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg>디데이</button>
    <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button>
  </nav>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="./calendar-tools.js"></script>
<script src="./bridge-ui.js"></script>
<script>
'use strict';
/* 선택: 공유에 쓸 Firebase 주소를 여기에 넣어 두면 "처음 시작" 때 주소를 묻지 않아요.
   예) const FIREBASE_URL = 'https://our-calendar-default-rtdb.asia-southeast1.firebasedatabase.app'; */
const FIREBASE_URL = 'https://uri-calendar-a00dc-default-rtdb.asia-southeast1.firebasedatabase.app';

/* ---------- 유틸 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const allEvents = () => Object.values(db.events);

function evSort(a, b) {

const eventsOn = date => visibleEvents().filter(e => e.start <= date && e.end >= date).sort((a, b) => {
  const am = a.start !== a.end, bm = b.start !== b.end;
  if (am !== bm) return am ? -1 : 1;
  if (a.allDay !== b.allDay) return a.allDay ? -1 : 1;

});
function markersOn(date) {
  const out = [];
  if (HOLIDAYS[date]) out.push({ kind: 'hol', label: HOLIDAYS[date] });
  const s = S().start, y = +date.slice(0, 4);
  if (s && date > s) {
    const n = diff(s, date) + 1;
    if (n % 100 === 0) out.push({ kind: 'anniv', label: `${n}일` });
    if (y > +s.slice(0, 4) && date === yearlyOn(y, s.slice(5))) out.push({ kind: 'anniv', label: `${y - +s.slice(0, 4)}주년` });

const monthEl = $('#month');
function renderCalendar() {
  $('#monthTitle').textContent = `${cur.y}년 ${cur.m + 1}월`;
  $('#filters').innerHTML = ['a', 'b', 'both'].map(o =>
    `<button class="chip ${hiddenOwners[o] ? 'off' : ''}" data-owner="${o}" style="--c:${esc(col(o))}"><i></i>${esc(nm(o))}${o === cfg.me ? ' (나)' : ''}</button>`).join('');
  const first = new Date(cur.y, cur.m, 1);
  const off = first.getDay();
  const dim = new Date(cur.y, cur.m + 1, 0).getDate();
  const weeks = Math.ceil((off + dim) / 7);
  const gridStart = ymd(new Date(cur.y, cur.m, 1 - off));
  const h = monthEl.clientHeight;
  const rowH = h ? h / weeks : 90;
  const lanes = Math.max(1, Math.floor((rowH - 24 - 13) / 17));
  const today = todayStr();
  const evs = visibleEvents().sort(evSort);
  let html = '';
  for (let w = 0; w < weeks; w++) {
    const ws = addDays(gridStart, w * 7), we = addDays(ws, 6);
    const occ = [];
    const hiddenCnt = Array(7).fill(0);
    let bars = '';
    for (const e of evs) {
      if (e.start > we || e.end < ws) continue;
      const s = Math.max(0, diff(ws, e.start)), en = Math.min(6, diff(ws, e.end));
      let lane = 0;
      while (occ[lane] && occ[lane].slice(s, en + 1).some(Boolean)) lane++;
      if (!occ[lane]) occ[lane] = Array(7).fill(false);
      for (let i = s; i <= en; i++) occ[lane][i] = true;
      if (lane >= lanes) { for (let i = s; i <= en; i++) hiddenCnt[i]++; continue; }
      const c = esc(col(e.owner));
      const multi = e.start !== e.end;
      const cls = ['bar', e.start < ws ? 'cl' : '', e.end > we ? 'cr' : '', !e.allDay && !multi ? 'timed' : ''].join(' ');
      bars += `<div class="${cls}" style="grid-column:${s + 1}/${en + 2};grid-row:${lane + 2};background:${c};--c:${c};--t:${c}22">${esc(e.title)}</div>`;
    }
    let cells = '';

      const cls = ['cell', dt.getMonth() !== cur.m ? 'other' : '', i === 0 ? 'sun' : '', i === 6 ? 'sat' : '',
        HOLIDAYS[d] ? 'hol' : '', d === today ? 'today' : '', d === selected ? 'sel' : ''].join(' ');
      cells += `<button class="${cls}" style="grid-column:${i + 1}" data-date="${d}" aria-label="${d}"><span class="dn">${dt.getDate()}</span>` +
        (mk.some(m => m.kind !== 'hol') ? `<span class="mk">${HEART}</span>` : '') +
        (hiddenCnt[i] ? `<span class="more">+${hiddenCnt[i]}</span>` : '') + '</button>';
    }
    html += `<div class="week" style="grid-template-rows:24px repeat(${lanes},17px) minmax(13px,1fr)">${cells}${bars}</div>`;
  }
  monthEl.innerHTML = html;
}

/* ---------- 디데이 ---------- */
function nextYearly(baseDate, from) {
  const startFrom = baseDate > from ? baseDate : from;
  const y = +startFrom.slice(0, 4);
  const c = yearlyOn(y, baseDate.slice(5));
  return c >= startFrom ? c : yearlyOn(y + 1, baseDate.slice(5));
}
const ddBadge = d => d > 0 ? `D-${d}` : d === 0 ? 'D-DAY' : `D+${-d}`;
function ddayInfo(x) {
  const t = todayStr();
  if (x.mode === 'since') {
    const n = diff(x.date, t) + 1;
    if (n >= 1) return { badge: `${n.toLocaleString()}일째`, sub: `${fmtDot(x.date)}부터`, key: 50000, cls: '' };
    const d = diff(t, x.date); return { badge: ddBadge(d), sub: `${fmtDot(x.date)}부터 세기`, key: d, cls: d <= 7 ? 'soon' : '' };
  }
  if (x.mode === 'yearly') {
    const nx = nextYearly(x.date, t), d = diff(t, nx);
    return { badge: ddBadge(d), sub: `매년 ${+x.date.slice(5, 7)}월 ${+x.date.slice(8, 10)}일 · 다음 ${fmtDot(nx)}`, key: d, cls: d <= 7 ? 'soon' : '' };
  }
  const d = diff(t, x.date);
  return { badge: ddBadge(d), sub: `${fmtDot(x.date)} (${WD[parse(x.date).getDay()]})`, key: d >= 0 ? d : 100000 - d, cls: d < 0 ? 'past' : d <= 7 ? 'soon' : '' };
}
function milestones() {
  const s = S().start; if (!s) return [];
  const t = todayStr(), n0 = diff(s, t) + 1, out = [];
  let k = Math.max(100, Math.ceil(n0 / 100) * 100);
  for (let i = 0; i < 3; i++, k += 100) out.push({ label: `${k}일`, date: addDays(s, k - 1) });
  const sy = +s.slice(0, 4);
  let found = 0;
  for (let y = 1; y <= 80 && found < 2; y++) {
    const d = yearlyOn(sy + y, s.slice(5));
    if (d >= t) { out.push({ label: `${y}주년`, date: d }); found++; }
  }
  return out.filter(o => o.date >= t).sort((a, b) => a.date < b.date ? -1 : 1).slice(0, 3);
}
function renderDday() {

      <button class="secondary-btn" data-act="new">처음 시작할게요</button>
      <button class="secondary-btn" data-act="join">상대의 초대 링크를 받았어요</button>
      ${safetySnapshot() ? '<button class="link-btn" data-act="safety">이 폰의 안전 백업 복구</button>' : ''}
    </div>`, { type: 'welcome', locked: true });
  onAct({ restore: () => openRecovery(true), new: stepNames, join: () => stepPaste(true), safety: () => { if (restoreSafetySnapshot()) { closeSheet(); toast('안전 백업을 복구했어요'); } } });
}
function openRecovery(fromWelcome) {
  openSheet(`<div class="sheet-head">${fromWelcome ? '<button class="txt-btn" data-act="back">뒤로</button>' : '<span></span>'}<h2>같은 사람으로 복구</h2>${fromWelcome ? '<span style="width:40px"></span>' : `<button class="icon-btn" data-act="close" aria-label="닫기">${CLOSE}</button>`}</div>
    <div class="sheet-body">
      <p class="note">Safari에서 우리 달력의 설정을 열어 복사한 “같은 사람 복구 코드”를 붙여넣으세요. 코드에 일정과 연결 권한이 들어 있어요. 상대에게 보내지 마세요. 이 기기의 일정은 지우지 않고 합쳐요.</p>
      <div class="paste-row"><input class="full-inp" id="r-code" placeholder="우리달력-복구:…" autocapitalize="off" autocomplete="off" spellcheck="false"><button class="ghost-btn" data-act="pasteCode">붙여넣기</button></div>
      <button class="primary-btn" data-act="go">달력과 역할 복구</button>
    </div>`, { type: fromWelcome ? 'welcome' : 'recovery', locked: true });
  onAct({
    back: openWelcome,
    close: () => closeSheet(),
    pasteCode: () => pasteInto($('#r-code')),
    go: () => {
      const o = readRecovery($('#r-code').value);
      if (!o) { toast('복구 코드를 확인해 주세요'); return; }
      if (restoreSamePerson(o)) { closeSheet(); toast('같은 달력과 역할을 복구했어요'); }
    }
  });
}
function stepNames() {
  openSheet(`<div class="sheet-head"><button class="txt-btn" data-act="back">뒤로</button><h2>우리 소개</h2><span style="width:40px"></span></div>
    <div class="sheet-body">
      <div class="form-card" style="margin-top:0">
        <div class="row"><span>내 이름</span><input class="inp" id="o-a" placeholder="예: 지민" maxlength="10" style="text-align:right" value="${esc(S().nameA)}"></div>
        <div class="row"><span>상대 이름</span><input class="inp" id="o-b" placeholder="예: 서준" maxlength="10" style="text-align:right" value="${esc(S().nameB)}"></div>
        <div class="row"><span>사귄 날 <small style="color:var(--sub);font-weight:500">(선택)</small></span><input class="inp" type="date" id="o-s" value="${esc(S().start)}"></div>
      </div>
      <button class="primary-btn" data-act="next">다음</button>
    </div>`, { type: 'welcome', locked: true });
  onAct({
    back: openWelcome,
    next: () => {
      const na = $('#o-a').value.trim().slice(0, 20), nb = $('#o-b').value.trim().slice(0, 20), sd = $('#o-s').value;
      if (!na || !nb) { toast('두 사람 이름을 입력해 주세요'); return; }
      cfg.me = 'a'; saveCfg();
      commit([['settings/nameA', na], ['settings/nameB', nb], ['settings/start', isDate(sd) ? sd : null]]);
      stepConnect(true);
    }
  });
}
function stepConnect(fromWelcome) {
  if (validDbUrl(FIREBASE_URL)) { startShare(FIREBASE_URL); stepInvite(); return; }
  openSheet(`<div class="sheet-head"><h2>상대와 연결하기</h2>${fromWelcome ? '' : `<button class="icon-btn" data-act="close" aria-label="닫기">${CLOSE}</button>`}</div>
    <div class="sheet-body">
      <p class="note">안내서 1단계에서 복사한 Firebase 주소를 붙여넣어 주세요. 처음 한 번만 하면 돼요.</p>
      <div class="paste-row"><input class="full-inp" id="c-url" placeholder="https://….firebasedatabase.app" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false"><button class="ghost-btn" data-act="pasteUrl">붙여넣기</button></div>
      <button class="primary-btn" data-act="go">연결하기</button>
      <button class="link-btn" data-act="close">나중에 할게요</button>
    </div>`, { type: fromWelcome ? 'welcome' : 'connect', locked: true });
  onAct({
    close: () => closeSheet(),
    pasteUrl: () => pasteInto($('#c-url')),
    go: () => {
      const u = $('#c-url').value.trim();
      if (!validDbUrl(u)) { toast('Firebase 주소를 확인해 주세요'); return; }
      startShare(u);
      stepInvite();
    }
  });
}
function stepInvite() {
  openSheet(`<div class="welcome">
      <div class="w-logo">${VENN}</div>
      <h2>초대 링크 보내기</h2>
      <p>${esc(nm(other()))}님이 이 링크로 들어오면<br>서로의 일정이 한 달력에 보여요.</p>
      <button class="primary-btn" data-act="share">초대 링크 보내기</button>
      <button class="link-btn" data-act="done">다 보냈어요</button>
    </div>`, { type: 'invite', locked: true });
  onAct({ share: shareInvite, done: () => closeSheet() });
}
function stepPaste(fromWelcome) {
  openSheet(`<div class="sheet-head">${fromWelcome ? '<button class="txt-btn" data-act="back">뒤로</button>' : '<span></span>'}<h2>초대 링크로 연결</h2>${fromWelcome ? '<span style="width:40px"></span>' : `<button class="icon-btn" data-act="close" aria-label="닫기">${CLOSE}</button>`}</div>
    <div class="sheet-body">
      <p class="note">상대에게 받은 초대 링크를 붙여넣어 주세요.</p>
      <div class="paste-row"><input class="full-inp" id="j-link" placeholder="초대 링크" autocapitalize="off" autocomplete="off" spellcheck="false"><button class="ghost-btn" data-act="pasteLink">붙여넣기</button></div>
      <button class="primary-btn" data-act="go">연결하기</button>
    </div>`, { type: fromWelcome ? 'welcome' : 'join', locked: true });
  onAct({
    back: openWelcome,
    close: () => closeSheet(),
    pasteLink: () => pasteInto($('#j-link')),
    go: () => {
      const o = readToken($('#j-link').value);
      if (!o) { toast('초대 링크를 확인해 주세요'); return; }
      doJoin(o);
    }
  });
}
function doJoin(o) { joinWith(o); closeSheet(); toast('연결했어요. 일정을 불러오는 중이에요'); }
function openJoinFromLink(token) {
  const o = readToken(token);
  if (!o) { toast('초대 링크가 올바르지 않아요'); if (!S().nameA && !syncOn()) openWelcome(); return; }
  if (syncOn() && o.c === cfg.code) { toast('이미 연결된 달력이에요'); return; }
  if (IS_IOS && !isStandalone()) {
    const link = inviteLink(token);
    openSheet(`<div class="welcome">
        <div class="w-logo">${VENN}</div>
        <h2>초대받았어요</h2>
        <p>아이폰은 홈 화면에 추가한 앱에서 연결해야<br>일정이 계속 저장돼요.</p>
        <ol class="steps"><li>아래 버튼으로 초대 링크 복사</li><li>Safari 공유(또는 ··· → 공유) → “홈 화면에 추가” → “웹 앱으로 열기” 켜기 → 추가</li><li>홈 화면의 우리달력 앱 → "초대 링크를 받았어요" → 붙여넣기</li></ol>
        <button class="primary-btn" data-act="copy">초대 링크 복사</button>
        <button class="link-btn" data-act="here">이 브라우저에서 그냥 쓸게요</button>
      </div>`, { type: 'welcome', locked: true });
    onAct({ copy: () => copyText(link), here: () => doJoin(o) });
    return;
  }
  openSheet(`<div class="welcome">
      <div class="w-logo">${VENN}</div>
      <h2>초대받았어요</h2>
      <p>연결하면 상대 일정과 내 일정을<br>한 달력에서 함께 봐요.</p>
      ${installHint()}
      <button class="primary-btn" data-act="go">연결하기</button>
      <button class="link-btn" data-act="no">취소</button>
    </div>`, { type: 'welcome', locked: true });
  onAct({ go: () => doJoin(o), no: () => { if (!S().nameA && !syncOn()) openWelcome(); else closeSheet(); } });
}
function openInAppNotice() {
  openSheet(`<div class="welcome">
      <div class="w-logo">${VENN}</div>
      <h2>브라우저에서 열어 주세요</h2>
      <p>메신저 안에서 열면 일정이 저장되지 않아요.<br>${IS_IOS ? 'Safari' : 'Chrome 같은 브라우저'}에서 열어 주세요.</p>
      ${IS_KAKAO ? '<button class="primary-btn" data-act="kakao">다른 브라우저로 열기</button>' : '<p class="note">화면 위나 아래의 메뉴에서 "다른 브라우저로 열기"를 눌러 주세요.</p>'}
      <button class="secondary-btn" data-act="copy">링크 복사</button>
    </div>`, { type: 'welcome', locked: true });
  onAct({
    kakao: () => { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href); },
    copy: () => copyText(location.href)
  });
}

/* ---------- 시작 ---------- */
function boot() {
  applyColors();
  renderStatus();
  renderCalendar();
  requestAnimationFrame(renderCalendar); // 화면 크기가 잡힌 뒤 칸 높이에 맞춰 다시 그림
  if (IN_APP) {
    if (IS_KAKAO) location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
    openInAppNotice();
    return;
  }
  const m = location.hash.match(/join=([A-Za-z0-9_-]+)/);
  if (m) {
    history.replaceState(null, '', location.pathname + location.search);
    openJoinFromLink(m[1]);
  } else if (!S().nameA && !syncOn()) {
    openWelcome();
  } else if (IS_IOS && !isStandalone() && !LS.get('cc_install_hint_v3', false)) {
    LS.set('cc_install_hint_v3',true);
    openSheet(`<div class="welcome"><h2>지금 쓰는 달력을 홈 화면으로</h2><ol class="steps"><li>아래에서 내 복구 코드를 복사하세요. 개인 일정과 연결 권한이 있으니 공유하지 마세요.</li><li>Safari 공유(또는 ··· → 공유) → 홈 화면에 추가 → ‘웹 앱으로 열기’ 켜기 → 추가.</li><li>홈 화면 아이콘으로 열고, 비어 있다면 ‘같은 사람으로 복구’를 선택하세요.</li></ol><button class="primary-btn" data-act="copy">같은 사람 복구 코드 복사</button><button class="link-btn" data-act="later">Safari에서 계속</button></div>`, {type:'install'});
    onAct({copy:()=>copyText(makeRecoveryCode()),later:()=>closeSheet()});
  }
  connect();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => { }); } catch { }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
  let lastDay = todayStr();
  setInterval(() => { const t = todayStr(); if (t !== lastDay) { lastDay = t; renderAll(); } }, 60000); // 자정이 지나면 오늘 표시 갱신
}
if (window.UriTools) window.UriTools.setContextProvider(() => ({ events: Object.values(db.events), settings: db.settings, googleCalendar: { onConnect: () => window.UriBridge.open({dbUrl: cfg.dbUrl, code: cfg.code, me: cfg.me}) } }));
else document.addEventListener('click', e => { if(e.target.closest('#calendar-tools-open')) toast('연결 후 달력을 다시 열어 주세요'); });
boot();
</script>
</body>
</html>
